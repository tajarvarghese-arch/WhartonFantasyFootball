name: Yahoo standings sync

on:
  schedule:
    # Tuesdays 09:00 UTC (Monday night football is final) during the NFL season.
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull standings from Yahoo
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_KEY: ${{ secrets.YAHOO_LEAGUE_KEY }}
        run: node scripts/yahoo-sync.mjs

      - name: Commit if the standings moved
        run: |
          git config user.name  "yahoo-sync[bot]"
          git config user.email "yahoo-sync[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/data/live.json)" ]; then
            git add public/data/live.json
            git commit -m "Yahoo sync: standings through $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No change."
          fi
