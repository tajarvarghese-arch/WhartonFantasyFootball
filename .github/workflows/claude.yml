name: Claude

# Mention @claude in an issue or PR comment and Claude edits the code and
# opens a pull request. Built for phone-driven changes: open the GitHub app,
# describe what you want, review the PR, merge — deploy.yml does the rest.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so Claude can read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Match deploy.yml so a build Claude runs here behaves like the real one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Backticks are shell command substitution once these args are
          # expanded — keep this string free of them. Model is intentionally
          # unpinned so the action's default is used; pin it later if wanted.
          claude_args: |
            --max-turns 30
            --allowedTools "Edit,Write,MultiEdit,Bash(npm ci),Bash(npm run build),Bash(npm run typecheck)"

            --system-prompt "Read CLAUDE.md first and follow it exactly. Always run 'npm run build' before opening a PR; it type-checks and builds, and a failing build must be fixed, not explained. Never edit files under public/data/ - the commissioner owns those through the live site."
